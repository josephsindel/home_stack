# Self-hosted LiveSync backend: CouchDB for Joe's life-ops Obsidian vault.
# Clients (Mac, iPhone, iPad) and the livesync-bridge on Thor talk to it over
# the tailnet only (Tailscale Ingress below): ClusterIP service, no LAN LB, no
# public ingress. Vault content is end-to-end encrypted by LiveSync, so CouchDB
# only ever stores ciphertext.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
  namespace: livesync
spec:
  interval: 1h
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      couchdb:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        # Run as couchdb (5984) from the start: the Synology NFS export squashes
        # every uid to 1024:100, so the entrypoint's root-only chown of the data
        # dir fails and (set -e) kills the container. Non-root skips that branch;
        # the share's dirs are 0777, so CouchDB can still write.
        pod:
          securityContext:
            runAsUser: 5984
            runAsGroup: 5984
            runAsNonRoot: true
        containers:
          app:
            image:
              repository: couchdb
              tag: "3.5.3"
            env:
              TZ: America/Los_Angeles
              NODENAME: couchdb.livesync.svc
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef: { name: couchdb-secret, key: COUCHDB_USER }
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef: { name: couchdb-secret, key: COUCHDB_PASSWORD }
              COUCHDB_SECRET:
                valueFrom:
                  secretKeyRef: { name: couchdb-secret, key: COUCHDB_SECRET }
            probes:
              # TCP, not /_up: require_valid_user makes every anonymous HTTP path 401.
              liveness:  { enabled: true, custom: true, spec: { tcpSocket: { port: 5984 }, initialDelaySeconds: 30, periodSeconds: 30 } }
              readiness: { enabled: true, custom: true, spec: { tcpSocket: { port: 5984 }, initialDelaySeconds: 10, periodSeconds: 10 } }
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { memory: 1Gi }
    service:
      # key == release name -> Service "couchdb" (what the Ingress expects).
      couchdb:
        controller: couchdb
        ports:
          http: { port: 5984 }
    persistence:
      data:
        enabled: true
        existingClaim: couchdb-data
        globalMounts:
          - path: /opt/couchdb/data
      config:
        enabled: true
        type: configMap
        name: couchdb-livesync-config
        globalMounts:
          - path: /opt/couchdb/etc/default.d/livesync.ini
            subPath: livesync.ini
            readOnly: true
