; Self-hosted LiveSync server settings (from the plugin's documented couchdb.ini).
; Loaded from default.d so the image's entrypoint can still write admin creds
; to local.d/docker.ini.
[couchdb]
single_node = true
max_document_size = 50000000

[cluster]
; one node: one shard, one copy
q = 1
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
