apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - storage.yaml
  - helmrelease.yaml
  - ingress.yaml
configMapGenerator:
  - name: couchdb-livesync-config
    namespace: livesync
    files:
      - config/livesync.ini
generatorOptions:
  disableNameSuffixHash: true
