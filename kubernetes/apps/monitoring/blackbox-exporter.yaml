apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.13.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 8s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: true
        # Pi-hole pair: the resolver answers a real upstream lookup.
        dns_resolve:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: cloudflare.com
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp:
                - '.*\tIN\tA\t.*'
        # Pi-hole pair: blocking is on and gravity is populated (a broken or
        # empty gravity DB still resolves fine, so dns_resolve can't see it).
        dns_blocked:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: doubleclick.net
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp:
                - '.*\tIN\tA\t0\.0\.0\.0$'
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: home-stack-lan-http
  namespace: monitoring
spec:
  jobName: home-stack-lan-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc:9115
    scheme: http
    path: /probe
  targets:
    static:
      labels:
        stack: home
      targets:
        - http://192.168.86.235/
        - http://192.168.86.237:8265/api/v2/status
        - http://192.168.86.248:8989/sonarr
        - http://192.168.86.249:7878/radarr
        - http://192.168.86.250:9696/prowlarr
        - http://192.168.86.251:6767/
        - http://192.168.86.252:8080/
        - http://192.168.86.253:8080/
        - http://192.168.86.254/api/health
---
# Pi-hole pair: primary on mediaserver (Docker), secondary hostNetwork on
# home-worker-1. See kubernetes/apps/pihole/pihole.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: home-stack-dns
  namespace: monitoring
spec:
  jobName: home-stack-dns
  # Every probe is a real query in Pi-hole's stats. At 30s this job was a top-10
  # "client" and skewed the dashboard; 60s still satisfies the 2m alert.
  interval: 60s
  scrapeTimeout: 10s
  module: dns_resolve
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc:9115
    scheme: http
    path: /probe
  targets:
    static:
      labels:
        stack: home
      targets:
        - 192.168.86.10:53
        - 192.168.86.27:53
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: home-stack-dns-blocked
  namespace: monitoring
spec:
  jobName: home-stack-dns-blocked
  # doubleclick.net queries land in "top blocked domains" and were drowning out
  # real traffic (97% of the secondary's blocks). Gravity health changes slowly,
  # so 5m is plenty.
  interval: 300s
  scrapeTimeout: 10s
  module: dns_blocked
  vmProberSpec:
    url: blackbox-exporter.monitoring.svc:9115
    scheme: http
    path: /probe
  targets:
    static:
      labels:
        stack: home
      targets:
        - 192.168.86.10:53
        - 192.168.86.27:53
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: home-stack-service-alerts
  namespace: monitoring
spec:
  groups:
    - name: home-stack-service-alerts
      rules:
        - alert: HomeStackLANServiceProbeFailed
          expr: probe_success{job="home-stack-lan-http"} == 0
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "LAN HTTP probe failed for {{ $labels.instance }}"
            description: "Blackbox exporter cannot reach {{ $labels.instance }} from the monitoring namespace."
        - alert: HomeStackMediaDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="media", deployment=~"tdarr|sonarr|radarr|prowlarr|qbittorrent|sabnzbd|bazarr|unpackerr|flaresolverr"} < 1
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Media deployment {{ $labels.deployment }} has no available replicas"
            description: "Kubernetes reports zero available replicas for {{ $labels.namespace }}/{{ $labels.deployment }}."
        - alert: HomeStackMediaRestartStorm
          expr: increase(kube_pod_container_status_restarts_total{namespace="media", pod=~"tdarr.*|sonarr.*|radarr.*|prowlarr.*|qbittorrent.*|sabnzbd.*|bazarr.*|unpackerr.*|flaresolverr.*"}[15m]) >= 3
          for: 0m
          labels:
            severity: page
          annotations:
            summary: "Media pod {{ $labels.pod }} is restarting repeatedly"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted at least three times in 15 minutes."
        - alert: HomeStackPiholeResolverDown
          expr: probe_success{job="home-stack-dns"} == 0
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "Pi-hole {{ $labels.instance }} is not answering DNS"
            description: "Clients fall back to the other Pi-hole, but DNS redundancy is gone until {{ $labels.instance }} recovers."
        # Separate, slower alert: a gravity rebuild can briefly let the canary
        # domain resolve, and that is not an outage.
        - alert: HomeStackPiholeBlockingBroken
          expr: probe_success{job="home-stack-dns-blocked"} == 0
          for: 15m
          labels:
            severity: page
          annotations:
            summary: "Pi-hole {{ $labels.instance }} is resolving but not blocking"
            description: "doubleclick.net no longer returns 0.0.0.0 on {{ $labels.instance }} - gravity is likely empty or corrupt, the failure mode that killed the old Pi-hole."
        - alert: HomeStackPiholeAllResolversDown
          expr: max(probe_success{job="home-stack-dns"}) == 0
          for: 1m
          labels:
            severity: page
          annotations:
            summary: "Both Pi-hole resolvers are down - household DNS outage"
            description: "Neither 192.168.86.10 nor 192.168.86.27 answers DNS. Emergency rollback: set UniFi Trusted DHCP DNS back to 192.168.86.1."
        - alert: HomeStackPiholeDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="pihole"} < 1
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "pihole/{{ $labels.deployment }} has no available replicas"
            description: "Secondary Pi-hole or nebula-sync is not running; the secondary stops answering or stops receiving config from the primary."
