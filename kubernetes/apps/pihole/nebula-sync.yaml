# nebula-sync: copies config from the primary Pi-hole (mediaserver) to the
# secondary (pihole.yaml). Syncs once at startup, then on CRON; a failed sync is
# logged and retried at the next tick (the process does not exit).
#
# Force an immediate sync: kubectl -n pihole rollout restart deploy/nebula-sync
#
# Selective (not FULL_SYNC) so the secondary's hostNetwork listening setup is
# never touched. The dns keys excluded below are FTLCONF_ env on the secondary;
# FTL rejects API writes to env-set keys, which would fail the whole patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-sync
  template:
    metadata:
      labels:
        app: nebula-sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:v0.11.2
          env:
            - name: PRIMARY
              valueFrom:
                secretKeyRef: { name: pihole-secret, key: PRIMARY }
            - name: REPLICAS
              valueFrom:
                secretKeyRef: { name: pihole-secret, key: REPLICAS }
            - name: TZ
              value: America/Los_Angeles
            - name: CRON
              value: "*/30 * * * *"
            - name: FULL_SYNC
              value: "false"
            # Rebuild gravity on the secondary after lists change. Gravity
            # downloads are conditional (If-Modified-Since), so this is cheap.
            - name: RUN_GRAVITY
              value: "true"
            - name: SYNC_CONFIG_DNS
              value: "true"
            - name: SYNC_CONFIG_DNS_EXCLUDE
              value: "listeningMode,interface,upstreams,revServers"
            - name: SYNC_CONFIG_RESOLVER
              value: "true"
            - name: SYNC_CONFIG_DATABASE
              value: "true"
            - name: SYNC_CONFIG_DHCP
              value: "false"
            - name: SYNC_CONFIG_NTP
              value: "false"
            - name: SYNC_CONFIG_MISC
              value: "false"
            - name: SYNC_CONFIG_DEBUG
              value: "false"
            - name: SYNC_GRAVITY_DHCP_LEASES
              value: "false"
            - name: SYNC_GRAVITY_GROUP
              value: "true"
            - name: SYNC_GRAVITY_AD_LIST
              value: "true"
            - name: SYNC_GRAVITY_AD_LIST_BY_GROUP
              value: "true"
            - name: SYNC_GRAVITY_DOMAIN_LIST
              value: "true"
            - name: SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP
              value: "true"
            - name: SYNC_GRAVITY_CLIENT
              value: "true"
            - name: SYNC_GRAVITY_CLIENT_BY_GROUP
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
